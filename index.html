<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subjects · Learning Library</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffefa;
      --bg: #f4f2ec;
      --ink: #202b35;
      --muted: #5b6670;
      --line: #dedfd8;
      --accent: #175c63;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 18px/1.65 Georgia, "Times New Roman", serif;
    }
    main {
      max-width: 850px;
      margin: clamp(16px, 6vw, 72px) auto;
      width: calc(100% - 32px);
      padding: clamp(24px, 6vw, 60px);
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--paper);
    }
    header { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    header p {
      margin: 0 0 10px;
      color: var(--accent);
      font: 700 12px/1.5 system-ui, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 46px); line-height: 1.16; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 24px 0; border-bottom: 1px solid var(--line); }
    h2 { margin: 0 0 6px; font: 650 22px/1.4 system-ui, sans-serif; }
    li p { margin: 0; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #b87824; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <header>
      <p>Learning Library</p>
      <h1>Subjects</h1>
    </header>
    <ul>
      <li>

      </li>
    </ul>
  </main>
</body>
</html>
